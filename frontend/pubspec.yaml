name: agrimate_ai
description: "AgriMate AI - Precision Farming Mobile App for Pakistani Farmers, Buyers, and Agronomists."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/farmer_3d.png
    - assets/field_aerial.jpg
    - assets/field_aerial_header.jpg

